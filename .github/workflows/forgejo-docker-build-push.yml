name: Build and Push Docker Image - forgejo

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  REGISTRY: forgejo.burbot-cardassian.ts.net
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Forgejo Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Download and install fortunes-off
        run: |
          wget https://deb.debian.org/debian/pool/main/f/fortune-mod/fortunes-off_1.99.1-7.1_all.deb
          dpkg -x fortunes-off_1.99.1-7.1_all.deb fortunes-extracted
          mkdir -p usr/share/games/fortunes/off
          cp -r fortunes-extracted/usr/share/games/fortunes/off/* usr/share/games/fortunes/off/ || true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

